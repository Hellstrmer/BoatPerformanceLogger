<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrolift T18 — Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css">
</head>

<body>

  <div id="dash">
    <div class="dash-main">
      <!-- Varvtal. Gapet mellan grepp-markören och stapelkanten är slippet. -->
      <div class="rpmwrap">
        <img src="plutoid_engineering.png" alt="Plutoid Engineering">
        <div class="wedge">
          <div class="wfill" id="wfill"></div>
          <div class="wgap" id="wgap"></div>
          <div class="wzone" id="wzone"></div>
        </div>
        <div class="segmask"></div>
        <div class="ghost" id="ghost"></div>
        <div class="rpmlab">RPM</div>
      </div>

      <!-- Vad båten ger tillbaka -->
      <div class="hero">
        <div class="box">
          <div class="big"><span id="rpm">0</span><span class="u">RPM</span></div>
        </div>
        <div class="box">
          <div class="big end"><span id="slip">0.0</span><span class="u">% Slip</span></div>
        </div>
        <div class="box">
          <div class="lab" style="margin-bottom:5px"></div>
          <div class="big mid"><span id="knots">0.0</span><span class="u">Knots</span></div>
        </div>
      </div>

      <!-- Vad du justerar -->

      <div class="row-top">
        <div class="cell">
          <div class="lab">Hiss</div>
          <div class="num"><span id="lift">0</span><span class="u">MM</span></div>
          <div class="bar">
            <div class="bfill" id="liftBar"></div>
          </div>
          <div class="scale"><span>0</span><span>77</span><span>154</span></div>
        </div>
        <div class="cell">
          <div class="lab">Trim</div>
          <div class="num"><span id="trim">0</span><span class="u">°</span></div>
          <div class="bar">
            <div class="bfill" id="trimBar"></div>
          </div>
          <div class="scale"><span>-5</span><span>10</span><span>25</span></div>
        </div>

      </div>

      <div class="row-bottom">
        <div class="cell tilt-cell">
          <svg id="tilt" viewBox="0 0 240 240" width="185" height="185">
            <circle cx="120" cy="120" r="110" fill="#0e0e10" stroke="#2a2a30" stroke-width="2" />
            <circle cx="120" cy="120" r="73" fill="none" stroke="#2a2a30" stroke-width="1" />
            <circle cx="120" cy="120" r="37" fill="none" stroke="#2a2a30" stroke-width="1" />
            <line id="cross-h" x1="60" y1="120" x2="180" y2="120" stroke="#44444d" stroke-width="1" />
            <line id="cross-v" x1="120" y1="60" x2="120" y2="180" stroke="#44444d" stroke-width="1" />
            <circle id="tiltDot" cx="120" cy="120" r="11" fill="var(--orange)" />
          </svg>
        </div>
        <div class="cell">
          <div class="lab">Vatten</div>
          <div class="num"><span id="waterpressure">0.0</span><span class="u">BAR</span></div>
          <div class="bar">
            <div class="bfill" id="waterBar"></div>
          </div>
          <div class="scale"><span>0</span><span>1.5</span><span>3</span></div>
        </div>
        <div class="cell">
          <div class="lab">Bränsle</div>
          <div class="num"><span id="fuel">0</span><span class="u">L/H</span></div>
          <div class="bar">
            <div class="bfill" id="fuelBar"></div>
          </div>
          <div class="scale"><span>0</span><span>35</span><span>70</span></div>
        </div>
      </div>
    </div>
    <div class="tank">
      <div class="tank-lab">TANK</div>
      <div class="tank-tube">
        <div class="tank-fill" id="tankFill"></div>
      </div>
      <div class="tank-num"><span id="tankLevel">0</span><span class="u">%</span></div>
    </div>
  </div>
  <div id="Alarm"></div>
  <div id="stale">NO SIGNAL TO CONTROLLER</div>

  </div>

  <script src="dash.js"></script>
</body>

</html>
