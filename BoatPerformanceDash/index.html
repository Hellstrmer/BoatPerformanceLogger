<!DOCTYPE html>
<html lang="sv">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hydrolift T18 — Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dash.css">
</head>

<body>

  <div id="dash">

    <!-- Varvtal. Gapet mellan grepp-markören och stapelkanten är slippet. -->
    <div class="rpmwrap">
      <div class="wedge">
        <div class="wfill" id="wfill"></div>
        <div class="wgap" id="wgap"></div>
        <div class="wzone" id="wzone"></div>
      </div>
      <div class="segmask"></div>
      <div class="ghost" id="ghost"></div>
      <div class="rpmlab">RPM</div>
    </div>

    <!-- Vad båten ger tillbaka -->
    <div class="hero">
      <div class="box">
        <div class="big"><span id="rpm">0</span><span class="u">RPM</span></div>
      </div>
       <div class="box">
        <div class="lab" style="margin-bottom:5px">Slip</div>
        <div class="big end"><span id="slip">0.0</span><span class="u">%</span></div>
      </div>
      <div class="box">
        <div class="lab" style="margin-bottom:5px"></div>
        <div class="big mid"><span id="knots">0.0</span><span class="u">Knots</span></div>
      </div>
    </div>

    <!-- Vad du justerar -->
    <div class="row">
      <div class="cell">
        <div class="lab">Hiss</div>
        <div class="num"><span id="lift">0</span><span class="u">MM</span></div>
        <div>
          <div class="bar">
            <div class="bfill" id="liftBar"></div>
          </div>
          <div class="scale"><span>0</span><span>77</span><span>154</span></div>
        </div>
      </div>
      <div class="cell">
        <div class="lab">Trim</div>
        <div class="num"><span id="trim">0.0</span><span class="u">°</span></div>
        <div>
          <div class="bar">
            <div class="bfill" id="trimBar"></div>
          </div>
          <div class="scale"><span>-5</span><span>10</span><span>25</span></div>
        </div>
      </div>

      <div class="cell">
        <div class="lab">Bränsle</div>
        <div class="num"><span id="fuel">0</span><span class="u">L/H</span></div>
        <div>
          <div class="bar">
            <div class="bfill" id="fuelBar"></div>
          </div>
          <div class="scale"><span>0</span><span>35</span><span>70</span></div>
        </div>
      </div>
    </div>

    <div id="stale">INGEN LÄNK</div>
  </div>

  <script src="dash.js"></script>
</body>

</html>
