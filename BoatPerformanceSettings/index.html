<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Hydrolift T18 — Dash</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/settings/settings.css">
</head>

<body>
    <div class="header">
        <img src="plutoid_engineering.png" class="logo" alt="Pluto Engineering">
        <span class="header-title">Hydrolift</span>
    </div>
    <div class="section_top">
        <div class="section-title_top">Kalibrering</div>
        <div class="section" id="Propeller">
            <div class="section-title">Propeller</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch"></div>Utväxling
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="prop_gear" step="0.01" inputmode="decimal"
                        placeholder="förhållande">
                    <span class="unit">:1</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch"></div>Stigning
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="prop_pitch" step="0.1" inputmode="decimal"
                        placeholder="tum">
                    <span class="unit">tum</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_lower"></div>Slip första gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="slip_warn" step="0.1" inputmode="decimal"
                        placeholder="%">
                    <span class="unit">%</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_upper"></div>Slip övre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="slip_bad" step="0.1" inputmode="decimal"
                        placeholder="%">
                    <span class="unit">%</span>
                </div>
            </div>
        </div>
        <div class="section" id="Motor">
            <div class="section-title">Motor</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch"></div>Varvstopp
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="redline" step="1" inputmode="decimal"
                        placeholder="rpm">
                    <span class="unit">rpm</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch"></div>Max varvtal
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="rpm_max" step="1" inputmode="decimal"
                        placeholder="rpm">
                    <span class="unit">rpm</span>
                </div>
            </div>
        </div>
        <div class="section" id="Lift">
            <div class="section-title">Lift</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_lower"></div>Undre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="lift_min" step="0.1" inputmode="decimal"
                        placeholder="mm">
                    <span class="unit">mm</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_upper"></div>Övre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="lift_max" step="0.1" inputmode="decimal"
                        placeholder="mm">
                    <span class="unit">mm</span>
                </div>
            </div>
            <button class="btn_setting" id="reset_lift">Nollställ position</button>
        </div>
        <div class="section" id="Trim">
            <div class="section-title">Trim</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_lower"></div>Undre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="trim_min" step="0.1" inputmode="decimal"
                        placeholder="grader">
                    <span class="unit">°</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_upper"></div>Övre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="trim_max" step="0.1" inputmode="decimal"
                        placeholder="grader">
                    <span class="unit">°</span>
                </div>
            </div>
            <button class="btn_setting" id="reset_trim">Nollställ position</button>
        </div>
        <div class="section" id="Vattentryck">
            <div class="section-title">Vattentryck</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_lower"></div>Undre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="water_min" step="0.1" inputmode="decimal"
                        placeholder="bar">
                    <span class="unit">bar</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_upper"></div>Övre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="water_max" step="0.1" inputmode="decimal"
                        placeholder="bar">
                    <span class="unit">bar</span>
                </div>
            </div>
        </div>
        <div class="section" id="Bränsletryck">
            <div class="section-title">Bränsletryck</div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_lower"></div>Undre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="fuel_min" step="0.1" inputmode="decimal"
                        placeholder="bar">
                    <span class="unit">bar</span>
                </div>
            </div>
            <div class="field">
                <div class="field-label">
                    <div class="swatch_upper"></div>Övre gräns
                </div>
                <div class="input-with-unit">
                    <input class="field-input" type="number" id="fuel_max" step="0.1" inputmode="decimal"
                        placeholder="bar">
                    <span class="unit">bar</span>
                </div>
            </div>
        </div>
    </div>
    <div class="status_bar" id="status_bar"></div>
    <button class="btn" id="save_settings">Spara</button>

    <div class="toast" id="toast">Sparat</div>
    <script src="/settings/settings.js"></script>
</body>

</html>
